name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Counts in the copy, changelog and manifests agree; generated docs are current; every page of the Worker responds
      # with a strict Content-Security-Policy.
      - run: npm run check
      # Bundle the Worker the way a deploy would, without deploying.
      - run: npm run build:dry-run
